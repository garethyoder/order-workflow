spring:
  jackson:
    mapper:
      # AWS event JSON uses capitalized keys (e.g. NewImage); Jackson 3 does not match them by default
      accept-case-insensitive-properties: true
  main:
    web-application-type: servlet
  cloud:
    function:
      definition: createCustomerInSquare
  application:
    name: create-customer-in-square
create-customer-in-square:
  square:
    access-token: test123
    environment: sandbox